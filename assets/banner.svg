<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>

    <!-- Animations -->
    <style>
      .pulse-orb {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .pulse-orb2 {
        animation: pulse2 5s ease-in-out infinite alternate;
      }
      .float-line {
        stroke-dasharray: 8 6;
        animation: dashMove 20s linear infinite;
      }
      .ping-point {
        animation: ping 2.5s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      @keyframes pulse {
        0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        100% { transform: scale(1.2) translate(30px, 20px); opacity: 0.6; }
      }
      @keyframes pulse2 {
        0% { transform: scale(1.1) translate(0, 0); opacity: 0.25; }
        100% { transform: scale(0.9) translate(-40px, -20px); opacity: 0.5; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -200; }
      }
      @keyframes ping {
        75%, 100% { transform: scale(2.2); opacity: 0; }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
      }
      .tag-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Glowing Orbs (Behind Grid and Elements) -->
  <circle cx="180" cy="100" r="140" fill="#0284c7" filter="url(#softGlow)" class="pulse-orb" />
  <circle cx="1020" cy="320" r="160" fill="#7c3aed" filter="url(#softGlow)" class="pulse-orb2" />
  <circle cx="950" cy="90" r="110" fill="#0d9488" filter="url(#softGlow)" class="pulse-orb" />

  <!-- Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Connecting Infrastructure Lines (Hybrid flow) -->
  <g stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35" class="float-line" fill="none">
    <path d="M 100 340 C 350 340, 450 180, 700 180 S 950 310, 1100 240" />
    <path d="M 150 120 C 350 80, 550 260, 850 220 S 1000 140, 1120 160" stroke="#a855f7" stroke-opacity="0.3" />
  </g>

  <!-- Visual Hybrid Architecture Nodes (Decorative Background Elements) -->
  <g opacity="0.45">
    <!-- On-Premises Cluster Node -->
    <rect x="80" y="270" width="110" height="60" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="135" y="305" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="sans-serif">🏢 On-Prem DC</text>

    <!-- Cloud Object Storage Node -->
    <rect x="1010" y="80" width="110" height="60" rx="8" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" />
    <text x="1065" y="115" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="sans-serif">☁️ Cloud / S3</text>
  </g>

  <!-- Central Content (Strictly in foreground) -->
  <g id="foreground-content">
    <!-- Category Badge -->
    <g transform="translate(600, 75)">
      <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="-165" cy="0" r="4" fill="#38bdf8" filter="url(#glow)" />
      <text x="-150" y="5" fill="#38bdf8" class="tag-text">HYBRID CLOUD &amp; DATA PROTECTION</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="160" text-anchor="middle" fill="#ffffff" font-size="44" class="title-text" filter="url(#glow)">
      Awesome Hybrid Cloud Infrastructure Backup
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="600" y="210" text-anchor="middle" fill="#94a3b8" font-size="20" class="sub-text">
      Curated Enterprise SaaS Platforms &amp; Modern Open-Source Backup Engines
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(600, 275)">
      <!-- Pill 1: On-Prem to Cloud -->
      <g transform="translate(-360, 0)">
        <rect x="0" y="0" width="220" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="110" y="26" text-anchor="middle" fill="#38bdf8" font-size="13" font-family="sans-serif" font-weight="600">🏢 Multi-Cloud &amp; On-Prem</text>
      </g>

      <!-- Pill 2: Immutability & Ransomware -->
      <g transform="translate(-115, 0)">
        <rect x="0" y="0" width="230" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="115" y="26" text-anchor="middle" fill="#a855f7" font-size="13" font-family="sans-serif" font-weight="600">🛡️ Immutable &amp; Air-Gapped</text>
      </g>

      <!-- Pill 3: Deduplication & Fast Recovery -->
      <g transform="translate(140, 0)">
        <rect x="0" y="0" width="220" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
        <text x="110" y="26" text-anchor="middle" fill="#34d399" font-size="13" font-family="sans-serif" font-weight="600">⚡ Deduplication &amp; CDP</text>
      </g>
    </g>

    <!-- Bottom Highlights / Stats bar -->
    <g transform="translate(600, 360)">
      <text x="0" y="0" text-anchor="middle" fill="#64748b" font-size="14" font-family="sans-serif">
        🔐 Enterprise SaaS • 🔓 Open-Source Tools • 📦 Kubernetes &amp; VMs • 🚀 Disaster Recovery as a Service
      </text>
    </g>
  </g>
</svg>
